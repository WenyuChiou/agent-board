name: Bug report
description: The pane shows something wrong, a step reads the wrong way, or setup fails.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: The part of progress.md it is about
      description: The project heading and the block or task that goes wrong, with private names removed. Most bugs are about how one block or step is read, and the text answers that at once.
      render: markdown
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin version (`claude plugin list`) and Claude Code version (`claude --version`).
      placeholder: andon 0.10.0, Claude Code 2.1.302
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System, terminal and pane language
      placeholder: Windows 11, Windows Terminal, zh-TW
  - type: input
    id: agent
    attributes:
      label: Which agent wrote the block
      description: claude, codex, gemini, cursor, … Leave empty for a task you keep by hand.
