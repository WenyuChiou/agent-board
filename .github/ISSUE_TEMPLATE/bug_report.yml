name: Bug report
description: Board, progress, messaging or setup does not behave as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Synthetic example of the block or task
      description: Write a small example from scratch with a fake project heading and block or task. Do not attach raw progress, inbox or session-log files. Remove prompts, replies, private paths, tokens, board links and personal or project names from any output or screenshot.
      render: markdown
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Agent Board and affected host versions. Include Claude Code only for its optional plugin.
      placeholder: Agent Board 0.23.0, affected host <version>
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
      description: Optional; run `node --version`, especially for board command or page problems.
      placeholder: v24.14.0
    validations:
      required: false
  - type: input
    id: system
    attributes:
      label: System, surface and board language
      placeholder: Windows 11, Codex desktop App / CLI / IDE, en
  - type: input
    id: agent
    attributes:
      label: Agent name
      description: codex, antigravity, claude, cursor, … Leave empty for a manual task.
  - type: input
    id: agent_version
    attributes:
      label: Agent version
      description: Optional; include the version of the agent named above.
      placeholder: <version>
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: How we would know it is done
      description: Optional. One behaviour a test could check, in a sentence. When triaging, the maintainer turns it into acceptance tests and adds the executor and milestone.
    validations:
      required: false
