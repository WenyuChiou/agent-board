name: Bug report
description: The pane shows something wrong, a step reads the wrong way, or setup fails.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Synthetic example of the block or task
      description: Write a small example from scratch with a fake project heading and block or task. Do not attach raw progress, inbox or session-log files. Remove prompts, replies, private paths, tokens, board links and personal or project names from any output or screenshot.
      render: markdown
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin version (`claude plugin list`) and Claude Code version (`claude --version`).
      placeholder: agent-board 0.10.0, Claude Code 2.1.302
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
      description: Optional; run `node --version`, especially for board command or page problems.
      placeholder: v24.14.0
    validations:
      required: false
  - type: input
    id: system
    attributes:
      label: System, terminal and pane language
      placeholder: Windows 11, Windows Terminal, zh-TW
  - type: input
    id: agent
    attributes:
      label: Agent name
      description: claude, codex, gemini, cursor, … Leave empty for a task you keep by hand.
  - type: input
    id: agent_version
    attributes:
      label: Agent version
      description: Optional; include the version of the agent named above.
      placeholder: <version>
    validations:
      required: false
