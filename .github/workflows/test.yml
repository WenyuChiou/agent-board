# Checks every push to main and every pull request, so a PR reports real checks
# (Wenyu's merge gate refuses a PR with zero checks).
# Runs offline: `claude plugin validate` and `claude plugin test` need no login or API key.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  # A newer push to a PR replaces its run; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Claude Code release the tests are checked against; bump on purpose and
  # keep the optional-plugin CI version in all three READMEs and guides in step.
  CLAUDE_CODE_VERSION: 2.1.301
  DISABLE_AUTOUPDATER: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

jobs:
  exchange:
    name: local exchange (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The CLI loads .ts files through Node's type stripping: on by default from
        # 22.18 and in 24. Both lines run so an import Node cannot load fails here.
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history with its tags, for the released files table below.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Synthetic file exchange and mock owner tests
        run: node --test tests/exchange.test.mjs tests/messaging.test.mjs

      # The board script other agents run, on plain Node.
      - name: Board script tests
        run: node --test tests/board.test.mjs tests/board-storage.test.mjs tests/codex-local.test.mjs tests/local-lock.test.mjs tests/prompt-hooks.test.mjs tests/codex-host.test.mjs tests/codex-fallback.test.mjs tests/legacy-connect.test.mjs tests/connect-worker.test.mjs

      # hooks/board-script.ts is the bundle of scripts/board-cli.ts; it must match its sources.
      # Bun is pinned so the bundle comes out the same.
      - name: Board bundle up to date
        if: runner.os != 'Windows' && matrix.node == 24
        run: npx --yes bun@1.4.2 scripts/build-board.ts --check

      # hooks/released.ts holds the hash of every file each tagged release generated, so an
      # installation from before the plugin kept a record of its output upgrades silently.
      - name: Released files table up to date
        if: runner.os != 'Windows' && matrix.node == 24
        run: npx --yes bun@1.4.2 scripts/build-released.ts --check

  # The tests of scripts/pr-check.mjs, in a job of their own: the exchange job on Windows
  # already uses most of its five minutes.
  pr-check-tests:
    name: pr-check tests (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: PR check tests
        run: node --test tests/pr-check.test.mjs

  plugin:
    name: plugin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}"

      # Its own step: fails early if `claude` does not resolve, and logs the version.
      - name: Claude Code version
        run: claude --version

      - name: Validate the plugin and marketplace
        run: claude plugin validate --strict .

      - name: Pane and hook tests
        run: claude plugin test .

      # A missing check script fails the step, so it cannot be skipped by deleting it.
      - name: Installer checks (setup.sh)
        if: runner.os != 'Windows'
        run: bash tests/setup.check.sh

      - name: Installer checks (setup.ps1)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/setup.check.ps1

      # The remote reporter is stdlib Python; it runs in a temp folder and writes no bytecode.
      - name: Remote reporter tests
        if: runner.os != 'Windows'
        run: python3 -B scripts/remote-reporter/test_pipeline.py

      - name: Remote reporter tests (Windows)
        if: runner.os == 'Windows'
        run: python -B scripts/remote-reporter/test_pipeline.py
