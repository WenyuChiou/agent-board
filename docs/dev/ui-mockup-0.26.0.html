<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" id="theme-color" content="#F3F5F7">
<title>Agent Board · Redesign 3 提案（合成資料）</title>
<link id="fav" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cstyle%3E.b%7Bfill%3Argb(23%2C32%2C38)%7D.d%7Bfill%3Argb(200%2C125%2C0)%7D%40media%20(prefers-color-scheme%3Adark)%7B.b%7Bfill%3Argb(230%2C228%2C220)%7D.d%7Bfill%3Argb(248%2C181%2C0)%7D%7D%3C%2Fstyle%3E%3Cpath%20class%3D%22b%22%20d%3D%22M31.04%208H20A%2012%2012%200%200%200%208%2020V44A%2012%2012%200%200%200%2020%2056H44A%2012%2012%200%200%200%2056%2044V32.96A%201%201%200%200%200%2054.35%2032.2A%2016%2016%200%200%201%2031.8%209.65A%201%201%200%200%200%2031.04%208Z%22%2F%3E%3Ccircle%20class%3D%22d%22%20cx%3D%2244%22%20cy%3D%2220%22%20r%3D%2212%22%2F%3E%3C%2Fsvg%3E">
<style>
:root{
  --accent:#185A7D; --done:#0D7444; --waiting-text:#8A5200; --waiting-fill:#F4B41A; --waiting-on:#231800; --waiting-edge:#D4960A; --brand:#C87D00;
  --running:#6E4F94; --alert:#B4272D; --project:#005243;
  --ground:#F3F5F7; --surface:#FCFDFE; --inset:#EAEFF2; --ink:#172026; --muted:#525B63;
  --line:#E0E6EB; --line-strong:#C8D2DA; --on-fill:#FCFDFE;
  --hover:color-mix(in oklab,var(--ink) 4.5%,var(--surface));
  --sel:color-mix(in oklab,var(--accent) 9%,var(--surface));
  --paste-bg:#FEF5DC; --paste-line:#E9C46A;
  --bg-pill-bg:#F3EFF8; --bg-pill-line:#D4C6E6; --bg-pill-ink:#5A3B80;
  --tile-bg:#EEF2F5; --tile-line:#D4DDE4;
  --surf-cli-bg:#ECEFF2; --surf-cli-line:#CFD7DE; --surf-cli-ink:#434B52;
  --surf-app-bg:#E7F2F8; --surf-app-line:#B8D4E3; --surf-app-ink:#185A7D;
  --font-sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei UI","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --font-mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --t-meta:12px; --t-sec:13px; --t-body:14px; --t-view:18px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r-s:6px; --r-m:10px; --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --side:208px; --rail:320px; --col:760px;
  color-scheme:light;
}
[data-theme=dark]{
  --accent:#00A3AF; --done:#3FAE6A; --waiting-text:#F8B500; --waiting-fill:#F8B500; --waiting-on:#141617; --waiting-edge:#E0A300; --brand:#F8B500;
  --running:#B39AD6; --alert:#E0696F; --project:#5FB3A0;
  --ground:#141617; --surface:#1e2022; --inset:#191b1c; --ink:#e6e4dc; --muted:#a3a29b;
  --line:#2d3032; --line-strong:#3d4143; --on-fill:#141617;
  --paste-bg:color-mix(in oklab,var(--waiting-fill) 14%,var(--surface));
  --paste-line:color-mix(in oklab,var(--waiting-fill) 38%,var(--line));
  --bg-pill-bg:#2B2436; --bg-pill-line:#4D3F63; --bg-pill-ink:#D5C4ED;
  --tile-bg:#26292C; --tile-line:#363A3E;
  --surf-cli-bg:#25282B; --surf-cli-line:#3D4145; --surf-cli-ink:#C9C7BE;
  --surf-app-bg:#182930; --surf-app-line:#2B4C59; --surf-app-ink:#5EC2CC;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:var(--t-body)/1.45 var(--font-sans);-webkit-font-smoothing:antialiased}
[data-theme=dark] body{line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.n{color:var(--muted);font-size:var(--t-meta);font-variant-numeric:tabular-nums;font-weight:500}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--waiting-fill);color:var(--waiting-on);font-size:var(--t-meta);font-weight:650;line-height:18px;text-align:center;font-variant-numeric:tabular-nums;flex:none}

/* Corner Light brand mark & icon (hooks/page-look.ts) */
.ab-logo{overflow:visible;display:block}
.ab-logo .ab-name{fill:var(--ink);transition:opacity .26s cubic-bezier(.45,0,.55,1)}
.ab-logo .ab-light{fill:var(--ink);transition:fill .26s cubic-bezier(.45,0,.55,1)}
.ab-logo .ab-halo{fill:var(--brand);opacity:0}
.ab-logo .ab-light,.ab-logo .ab-halo,.ab-logo .ab-hit{transform-box:fill-box;transform-origin:center}
.ab-logo .ab-hit{transition:transform .26s cubic-bezier(.2,.7,.2,1)}
.ab-logo:active .ab-hit{transform:scale(.88)}
.ab-logo.is-working .ab-light{animation:ab-l-breathe 2.4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes ab-l-breathe{0%,100%{transform:scale(1)}50%{transform:scale(.78)}}
.ab-logo.is-waiting .ab-light{fill:var(--brand);animation:ab-l-turn 1.2s cubic-bezier(.45,0,.55,1) 1}
.ab-logo.is-waiting .ab-halo{animation:ab-l-flash 1.6s cubic-bezier(.1,.6,.3,1) 1,ab-l-glow 4.8s cubic-bezier(.45,0,.55,1) 1.6s infinite}
@keyframes ab-l-turn{0%{transform:scale(.86)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes ab-l-flash{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@keyframes ab-l-glow{0%,100%{opacity:0;transform:scale(1.05)}50%{opacity:.3;transform:scale(1.6)}}
.ab-logo.is-offline .ab-name{opacity:.55}
.ab-logo.is-offline .ab-light{fill:var(--muted)}

.ab-icon{overflow:visible;display:block}
.ab-icon .ab-board{fill:var(--ink);transition:opacity .26s cubic-bezier(.45,0,.55,1)}
.ab-icon .ab-dot{fill:var(--ink);transition:fill .26s cubic-bezier(.45,0,.55,1)}
.ab-icon .ab-halo{fill:var(--brand);opacity:0}
.ab-icon .ab-dot,.ab-icon .ab-halo,.ab-icon .ab-hd{transform-box:view-box;transform-origin:44px 20px}
.ab-icon .ab-hb{transform-box:view-box;transform-origin:32px 32px}
.ab-icon .ab-hb,.ab-icon .ab-hd{transition:transform .26s cubic-bezier(.2,.7,.2,1)}
.ab-icon:active .ab-hd{transform:scale(.9)}
.ab-icon:active .ab-hb{transform:scale(.96)}
.ab-icon.is-working .ab-dot{animation:ab-i-breathe 2.4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes ab-i-breathe{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
.ab-icon.is-waiting .ab-dot{fill:var(--brand);animation:ab-i-turn 1.2s cubic-bezier(.45,0,.55,1) 1}
.ab-icon.is-waiting .ab-halo{animation:ab-i-flash 1.6s cubic-bezier(.1,.6,.3,1) 1,ab-i-glow 4.8s cubic-bezier(.45,0,.55,1) 1.6s infinite}
@keyframes ab-i-turn{0%{transform:scale(.86)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes ab-i-flash{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
@keyframes ab-i-glow{0%,100%{opacity:0;transform:scale(1.05)}50%{opacity:.22;transform:scale(1.45)}}
.ab-icon.is-offline .ab-board{fill:none;stroke:var(--ink);stroke-width:3;opacity:.6}
.ab-icon.is-offline .ab-dot{fill:none;stroke:var(--muted);stroke-width:3}

/* shell */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.app.has-rail{grid-template-columns:var(--side) minmax(0,1fr) var(--rail)}

/* sidebar */
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden}
.brand{display:flex;align-items:center;padding:15px 16px 11px}
.search{display:flex;align-items:center;gap:6px;min-width:0;height:32px;margin:0 8px 6px;padding:0 6px 0 8px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--inset);color:var(--muted);transition:border-color 140ms var(--ease-out),box-shadow 140ms var(--ease-out)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 16%,transparent)}
.search input{flex:1 1 0%;min-width:0;width:0;border:0;outline:0;background:transparent;font:inherit;font-size:var(--t-sec);color:var(--ink)}
.search input::placeholder{color:var(--muted)}
kbd{font:500 var(--t-meta)/1 var(--font-mono);color:var(--muted);border:1px solid var(--line-strong);border-radius:4px;padding:2px 5px}
.nav{display:flex;flex-direction:column;gap:1px;padding:4px 8px}
.nb{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border:0;border-radius:var(--r-s);background:none;font-size:var(--t-sec);text-align:left;transition:background-color 140ms var(--ease-out),transform 120ms var(--ease-out)}
.nb:active{transform:scale(0.97)}
.nb > span:first-child{flex:1}
.nb[aria-current=true]{background:var(--sel);color:var(--accent);font-weight:600}
.s-h{display:flex;align-items:center;gap:6px;padding:18px 16px 4px;font-size:var(--t-meta);font-weight:600;color:var(--muted);list-style:none;cursor:default}
details > summary.s-h{cursor:pointer}
details > summary.s-h::-webkit-details-marker{display:none}
details > summary .i{width:12px;height:12px;transition:transform 150ms var(--ease-out)}
details[open] > summary .i{transform:rotate(90deg)}
.ai-row{display:flex;align-items:center;gap:6px;width:calc(100% - 16px);height:30px;margin:0 8px;padding:0 8px;border:0;border-radius:var(--r-s);background:none;font-size:var(--t-sec);text-align:left;transition:background-color 140ms var(--ease-out),opacity 140ms var(--ease-out),transform 120ms var(--ease-out)}
.ai-row:active{transform:scale(0.97)}
.ai-row[aria-pressed=true]{background:var(--sel)}
.ai-row.is-off{color:var(--muted)}
.ai-row.is-off .mk,.m-ai .chip.is-off .mk{opacity:.65}
.ai-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-row .sp{flex:1;min-width:4px}
.ai-row .mk{width:22px;height:22px}
.ai-row .mk svg{width:14px;height:14px}
.surfs{display:inline-flex;align-items:center;gap:3px;flex:none}
.surf-pill{display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 5px;border-radius:4px;font:600 10.5px/1 var(--font-mono);letter-spacing:.02em;white-space:nowrap;flex:none}
.surf-pill.is-cli{background:var(--surf-cli-bg);border:1px solid var(--surf-cli-line);color:var(--surf-cli-ink)}
.surf-pill.is-app{background:var(--surf-app-bg);border:1px solid var(--surf-app-line);color:var(--surf-app-ink)}
.si{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.st{width:8px;height:8px;border-radius:50%;flex:none;margin-right:4px}
.st.run{background:var(--done)}
.st.open{border:1.5px solid var(--done);background:transparent}
.st.off{width:8px;height:2px;border-radius:1px;background:var(--muted)}
.s-foot{margin-top:auto;display:flex;align-items:center;gap:2px;height:40px;padding:0 6px 0 16px;border-top:1px solid var(--line);font-size:var(--t-meta);color:var(--muted)}
.s-foot .ver{flex:1;font-variant-numeric:tabular-nums}
.ib{display:inline-grid;place-items:center;width:28px;height:28px;padding:0;border:0;border-radius:var(--r-s);background:none;color:var(--muted);flex:none;transition:background-color 140ms var(--ease-out),color 140ms var(--ease-out),transform 120ms var(--ease-out)}
.ib:active{transform:scale(0.97)}
.ib-sm{display:inline-grid;place-items:center;width:26px;height:26px;padding:0;border:1px solid var(--line-strong);border-radius:var(--r-s);background:var(--surface);color:var(--muted);flex:none;transition:background-color 140ms var(--ease-out),border-color 140ms var(--ease-out),color 140ms var(--ease-out),transform 120ms var(--ease-out)}
.ib-sm .i{width:13px;height:13px}
.ib-sm:active{transform:scale(0.97)}

/* AI mark: monochrome official SVGs inside tinted tile so gold stays the one loud colour */
.mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;flex:none;background:var(--tile-bg);border:1px solid var(--tile-line);color:var(--ink)}
.mk svg{width:13px;height:13px;display:block}
.mk.sm{width:16px;height:16px;border-radius:4px}
.mk.sm svg{width:11px;height:11px}

/* work column & unified top-bar */
.work{min-width:0;padding:20px 32px 64px}
.col{max-width:var(--col)}
.top-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 16px}
.v-title{margin:0 4px 0 0;font-size:var(--t-view);font-weight:650;letter-spacing:.01em;line-height:1.25;text-wrap:balance}
.filter-grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chip-w{position:relative}
.chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 8px 0 9px;border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);font-size:var(--t-sec);white-space:nowrap;transition:border-color 140ms var(--ease-out),background-color 140ms var(--ease-out),color 140ms var(--ease-out),transform 120ms var(--ease-out)}
.chip:active{transform:scale(0.97)}
.chip .i{width:12px;height:12px;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--sel)}
.chip.on .i{color:var(--accent)}
.clear-btn{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 9px 0 7px;border:1px solid var(--line-strong);border-radius:14px;background:var(--inset);color:var(--muted);font-size:var(--t-meta);font-weight:500;white-space:nowrap;transition:background-color 140ms var(--ease-out),border-color 140ms var(--ease-out),color 140ms var(--ease-out),transform 120ms var(--ease-out)}
.clear-btn .i{width:12px;height:12px}
.clear-btn:active{transform:scale(0.97)}
.menu{position:absolute;z-index:25;top:32px;left:0;min-width:184px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 10px 28px rgb(0 0 0 / .10);transform-origin:top left;transition:opacity 140ms var(--ease-out),transform 140ms var(--ease-out);@starting-style{opacity:0;transform:scale(0.96)}}
.menu label{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:var(--r-s);font-size:var(--t-sec);cursor:pointer;touch-action:manipulation}
.menu label .n{margin-left:auto}
.menu input{accent-color:var(--accent);margin:0}

/* compact interactive pulse-bar & sync-btn */
.pulse-bar{display:flex;align-items:center;gap:5px;margin-left:auto;flex-wrap:wrap}
.p-pill{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--muted);font-size:var(--t-meta);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;transition:border-color 140ms var(--ease-out),background-color 140ms var(--ease-out),color 140ms var(--ease-out),transform 120ms var(--ease-out)}
.p-pill .i{width:12px;height:12px}
.p-pill:active,.sync-btn:active{transform:scale(0.97)}
.p-pill.on{border-color:var(--accent);color:var(--accent);background:var(--sel)}
.p-pill.need{border-color:var(--waiting-edge);background:var(--waiting-fill);color:var(--waiting-on)}
.dot-need{width:7px;height:7px;border-radius:50%;background:var(--waiting-on);flex:none}
.sync-btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--muted);font-size:var(--t-meta);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;transition:border-color 140ms var(--ease-out),background-color 140ms var(--ease-out),color 140ms var(--ease-out),transform 120ms var(--ease-out)}
.sync-btn .i{width:13px;height:13px}
.sync-btn.is-stale{border-color:var(--paste-line);background:var(--paste-bg);color:var(--waiting-text);font-weight:600}
.sync-btn.is-spin .i-sync{animation:spin 380ms var(--ease-out)}
@keyframes spin{to{transform:rotate(360deg)}}
#content.is-stale .list{opacity:.55;transition:opacity 180ms var(--ease-out)}

/* sections, swallowtail flag & raised Washoku needs-sheet */
.sec + .sec{margin-top:26px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 0 6px;padding:0 2px;font-size:14px;font-weight:650;color:var(--muted)}
.needs-wrap{display:flex;flex-direction:column}
.sheet-tab{align-self:flex-start}
.flag{display:inline-flex;align-items:center;gap:6px;min-height:32px;margin:0;padding:0 16px 0 12px;background:var(--waiting-fill);color:var(--waiting-on);box-shadow:inset 0 -1px 0 var(--waiting-edge);font-size:18px;font-weight:650;line-height:1.3;font-variant-numeric:tabular-nums;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 50%,100% 100%,0 100%);border-radius:var(--r-s) 0 0 0}
h2.flag{font-size:14px}
.flag b{font-weight:700}
.flag.calm{background:var(--surface);color:var(--muted);border:1px solid var(--line-strong);border-bottom:0;box-shadow:none;clip-path:none;border-radius:var(--r-s) var(--r-s) 0 0;padding:0 12px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:visible}
.needs-sheet{border:1px solid var(--line-strong);border-radius:0 var(--r-m) var(--r-m) var(--r-m);box-shadow:0 1px 3px rgb(0 0 0 / .04)}
.it:first-child > .it-r,.it:first-child > .row,.it:first-child > .fold,.it:first-child > .empty{border-top-left-radius:var(--r-m);border-top-right-radius:var(--r-m)}
.needs-sheet > .it:first-child > .it-r,.needs-sheet > .it:first-child > .row,.needs-sheet > .it:first-child > .fold,.needs-sheet > .it:first-child > .empty{border-top-left-radius:0}
.it:last-child > .it-r,.it:last-child > .row,.it:last-child > .fold,.it:last-child > .empty{border-bottom-left-radius:var(--r-m);border-bottom-right-radius:var(--r-m)}

/* item: two lines folded */
.it + .it{border-top:1px solid var(--line)}
.it-r{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:10px;padding:10px 12px 9px;cursor:pointer;touch-action:manipulation;transition:background-color 120ms var(--ease-out)}
.it.open > .it-r,.it.sel > .it-r{background:var(--sel)}
.it.flash > .it-r{animation:flash 1.4s var(--ease-out)}
@keyframes flash{from{background:color-mix(in oklab,var(--done) 16%,var(--surface))}to{background:var(--surface)}}
.it-r > .mk,.it-r > .chk{margin-top:-1px}
.it-t{min-width:0;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.open .it-t{white-space:normal}
.it-r.is-approval .it-t{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.it.open .it-r.is-approval .it-t{flex-wrap:wrap;white-space:normal}
.approval-badge{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 6px;border:1px solid var(--paste-line);border-radius:999px;background:var(--paste-bg);color:var(--waiting-text);font-size:var(--t-meta);font-weight:600;white-space:nowrap;flex:none}
.approval-badge .i{width:11px;height:11px}
.subagent-tag{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 6px;border:1px solid var(--line-strong);border-radius:999px;background:var(--inset);color:var(--muted);font-size:var(--t-meta);font-weight:500;white-space:nowrap;flex:none}
.approval-cmd{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:1px 6px;border:1px solid var(--line);border-radius:4px;background:var(--inset);color:var(--ink);font:500 var(--t-meta)/1.4 var(--font-mono)}
.it.open .it-r.is-approval .approval-cmd{white-space:normal;word-break:break-all}
.approval-ttl{font:600 var(--t-meta)/1 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--waiting-text);white-space:nowrap;flex:none}
.approval-ttl.is-expired{color:var(--alert)}
.approval-why{display:flex;align-items:center;gap:6px;padding:0 12px 10px 42px}
.approval-why input{flex:1;min-width:0;height:30px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--r-s);background:var(--surface);color:var(--ink);font:var(--t-sec)/1.4 var(--font-sans)}

.it-m{grid-column:2;display:flex;align-items:center;gap:8px;min-height:26px;margin-top:3px;font-size:var(--t-sec);color:var(--muted);min-width:0}
.meta{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.acts{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:26px;padding:0 10px;border:1px solid var(--line-strong);border-radius:var(--r-s);background:var(--surface);font-size:var(--t-sec);white-space:nowrap;flex:none;transition:transform 120ms var(--ease-out),border-color 140ms var(--ease-out),color 140ms var(--ease-out),background-color 140ms var(--ease-out)}
.btn .i{width:12px;height:12px}
.btn:active{transform:scale(0.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-fill)}

.pill.is-readonly{display:inline-flex;align-items:center;height:26px;padding:0 9px;border:1px dashed var(--line-strong);border-radius:var(--r-s);background:var(--inset);color:var(--muted);font-size:var(--t-sec);white-space:nowrap;flex:none;cursor:not-allowed}
.native-pill{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 7px;border:1px solid var(--surf-app-line);border-radius:999px;background:var(--surf-app-bg);color:var(--surf-app-ink);font-size:var(--t-meta);font-weight:600;white-space:nowrap;flex:none}
.st-bg{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 6px;border:1px solid var(--bg-pill-line);border-radius:999px;background:var(--bg-pill-bg);color:var(--bg-pill-ink);font-size:var(--t-meta);font-weight:600;white-space:nowrap;flex:none}

.ci-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--done)}
.pr-pill.is-pending .ci-dot{background:var(--waiting-fill)}
.pr-pill.is-fail .ci-dot{background:var(--alert)}
.sub-pill{display:inline-flex;align-items:center;gap:3px;height:18px;padding:0 5px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--muted);font:600 11px/1 var(--font-mono);white-space:nowrap;flex:none;cursor:help}
.live-dot,.unsure-dot{display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:1;flex:none;cursor:help}
.live-dot{color:var(--done)}
.unsure-dot{color:var(--waiting-text)}
.chk{width:18px;height:18px;margin:1px;border:1.5px solid var(--line-strong);border-radius:50%;background:var(--surface);display:grid;place-items:center;padding:0;color:transparent;flex:none;transition:border-color 140ms var(--ease-out),color 140ms var(--ease-out),transform 120ms var(--ease-out)}

.paste-tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px 0 6px;border:1px solid var(--paste-line);border-radius:999px;background:var(--paste-bg);color:var(--waiting-text);font-size:var(--t-meta);font-weight:600;white-space:nowrap;flex:none;cursor:help;touch-action:manipulation}

.dlv.got{color:var(--done)}
@keyframes pulse{50%{opacity:.25}}

/* instant CSS [data-tip] tooltips (edge-aware so zero horizontal overflow) */
[data-tip]{position:relative}
[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;z-index:45;left:0;bottom:calc(100% + 6px);width:max-content;max-width:220px;padding:5px 8px;border-radius:var(--r-s);background:var(--ink);color:var(--surface);font:450 var(--t-meta)/1.35 var(--font-sans);white-space:normal;box-shadow:0 6px 18px rgb(0 0 0 / .18);pointer-events:none}
.pulse-bar [data-tip]::after,.acts [data-tip]::after,.r-head [data-tip]::after,.m-top [data-tip]::after,.s-foot [data-tip]::after,.cmd [data-tip]::after,.ai-row .badge[data-tip]::after{left:auto;right:0}
.top-bar [data-tip]::after,.r-head [data-tip]::after,.m-top [data-tip]::after{bottom:auto;top:calc(100% + 6px)}
.ai-row[data-tip]::after{max-width:184px}

/* opened detail */
.d{padding:2px 12px 14px 42px;font-size:var(--t-sec)}
.d p{margin:0 0 6px;max-width:68ch}
.d-head{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:var(--t-meta);color:var(--muted);min-width:0}

.d-task{font-weight:600}
.d-ctx{color:var(--muted)}
.d-paste{display:flex;align-items:center;gap:8px;margin:6px 0 8px;flex-wrap:wrap}
.pr-detail{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 8px;padding:5px 8px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--inset);font-size:var(--t-meta);color:var(--muted)}
.pr-detail code{font:500 var(--t-meta)/1.3 var(--font-mono);color:var(--ink)}
.sub-list{margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--inset);font-size:var(--t-meta)}

.sub-dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--running)}
.sub-dot.is-done{background:var(--done)}
.sub-nm{font:500 var(--t-meta)/1.3 var(--font-mono);color:var(--ink)}
.bg-hold{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding:8px 10px;border:1px solid var(--bg-pill-line);border-radius:var(--r-s);background:var(--bg-pill-bg);font-size:var(--t-sec)}

.steps{list-style:none;margin:8px 0 10px;padding:0}
.steps li{display:grid;grid-template-columns:16px 1fr;gap:6px;padding:2px 0;color:var(--muted)}
.steps li.now{color:var(--ink);font-weight:600}

.steps li.x .g{color:var(--done)}
.steps li.q .g{color:var(--waiting-text)}
.steps li.w .g{color:var(--running)}
.cmd{display:flex;align-items:center;gap:8px;margin:8px 0;padding:6px 6px 6px 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--inset);font:var(--t-sec)/1.4 var(--font-mono);overflow-x:auto}
.cmd code{flex:1;white-space:nowrap}
.reply{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.reply textarea{flex:1;min-width:0;min-height:36px;max-height:160px;resize:vertical;padding:7px 10px;border:1px solid var(--line-strong);border-radius:var(--r-s);background:var(--surface);color:var(--ink);font:var(--t-sec)/1.45 var(--font-sans)}
.reply textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 16%,transparent)}
.more{display:flex;align-items:center;gap:4px;margin-top:10px;margin-left:-4px}

/* folded groups and one-line rows */
#sec-stop,#sec-done{scroll-margin-top:112px}
.fold-head{display:flex;align-items:center;gap:6px}
.fold{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border:0;background:none;font-size:var(--t-sec);color:var(--muted);text-align:left;min-width:0;transition:background-color 120ms var(--ease-out)}
.fold .i{width:12px;height:12px;transition:transform 150ms var(--ease-out)}
.fold[aria-expanded=true] .i{transform:rotate(90deg)}
.fold .lab{color:var(--ink);font-weight:600}
.pill-act{display:inline-flex;align-items:center;gap:4px;height:24px;margin-right:8px;padding:0 8px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--muted);font-size:var(--t-meta);font-weight:500;white-space:nowrap;flex:none;transition:background-color 140ms var(--ease-out),border-color 140ms var(--ease-out),color 140ms var(--ease-out),transform 120ms var(--ease-out)}
.pill-act .i{width:12px;height:12px}
.pill-act:active{transform:scale(0.97)}
.row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;column-gap:10px;padding:9px 12px;cursor:pointer;touch-action:manipulation;transition:background-color 120ms var(--ease-out)}
.row .t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:var(--t-meta);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}

.row .r .age-col{width:44px;text-align:right}
.row.wait .t{color:var(--muted)}
.row.wait .who{color:var(--ink);font-weight:600;margin-right:6px}
.prog{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.bar{width:36px;height:4px;border-radius:2px;background:var(--line)}
.bar i{display:block;height:100%;border-radius:2px;background:var(--running)}
.row.past .t{color:var(--muted)}
.it.open > .row,.it.sel > .row{background:var(--sel)}
.empty{padding:18px 16px}
.empty b{display:block;font-weight:600}
.empty span{font-size:var(--t-meta);color:var(--muted);font-variant-numeric:tabular-nums}
.none{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:28px 2px;font-size:var(--t-body);color:var(--muted)}

/* detail rail, wide screens only (320px) */
.rail{display:none}
.app.has-rail .rail{display:block;position:sticky;top:0;height:100vh;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-left:1px solid var(--line)}
.r-head{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:10px 10px 10px 14px;font-size:var(--t-meta);color:var(--muted);border-bottom:1px solid var(--line)}
.r-head .sp{flex:1;min-width:4px}
.r-head .r-meta{flex:1 0 100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums;order:2}
.r-tools{display:inline-flex;align-items:center;gap:1px;flex:none}
.r-tools .ib{width:28px;height:28px}
.r-body{padding:16px}
.r-body h2{margin:0 0 10px;font-size:14px;font-weight:650;line-height:1.4;text-wrap:pretty}
.r-body .d{padding:0}
.r-body .acts{margin:12px 0 0;flex-wrap:wrap}

/* toast */
.toast{position:fixed;z-index:40;left:calc(var(--side) + 32px);bottom:24px;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-radius:var(--r-s);background:var(--ink);color:var(--surface);font-size:var(--t-sec);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity 180ms var(--ease-out),transform 180ms var(--ease-out)}

.toast button{border:0;background:none;padding:4px 8px;border-radius:4px;color:var(--surface);font-weight:650;text-decoration:underline;text-underline-offset:3px}
.toast button:active{transform:scale(0.97)}

/* phone-only parts */
.m-top,.m-ai,.m-tabs,.m-pulse,.sheet,.scrim{display:none}

/* mockup-only switch */
.demo{position:fixed;z-index:30;right:12px;bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:2px;max-width:calc(100vw - 24px);padding:4px 6px;border:1px dashed var(--line-strong);border-radius:8px;background:var(--surface);font-size:var(--t-meta);color:var(--muted)}
.demo span{padding:0 4px}
.demo button{border:0;background:none;padding:3px 6px;border-radius:4px;font-size:var(--t-meta);color:var(--muted);white-space:nowrap;transition:background-color 140ms var(--ease-out),color 140ms var(--ease-out),transform 120ms var(--ease-out)}
.demo button:active{transform:scale(0.97)}
.demo button[aria-pressed=true]{background:var(--sel);color:var(--accent);font-weight:600}

@media (hover:hover) and (pointer:fine){
  .ab-logo:hover .ab-hit{transform:scale(1.14)}
  .ab-icon:hover .ab-hd{transform:scale(1.08)}
  .nb:hover,.ai-row:hover,.ib:hover,.menu label:hover,.it-r:hover,.fold:hover,.row:hover,.btn.ghost:hover,.demo button:hover{background:var(--hover)}
  .ib:hover{color:var(--ink)}
  .ib-sm:hover,.pill-act:hover,.clear-btn:hover{background:var(--hover);border-color:var(--accent);color:var(--accent)}

  .p-pill.need:hover{border-color:var(--waiting-on);color:var(--waiting-on);filter:brightness(1.04)}

  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.pri:hover{filter:brightness(1.08);color:var(--on-fill);border-color:var(--accent)}
  .btn.bg-stage:hover{filter:brightness(0.96);color:var(--bg-pill-ink);border-color:var(--bg-pill-ink)}
  .btn.ghost:hover{color:var(--accent);border-color:transparent}
  .native-pill:hover{filter:brightness(0.97)}
  .chk:hover{border-color:var(--done);color:var(--done)}
  [data-tip]:hover::after{content:attr(data-tip);position:absolute;z-index:45;left:0;bottom:calc(100% + 6px);width:max-content;max-width:220px;padding:5px 8px;border-radius:var(--r-s);background:var(--ink);color:var(--surface);font:450 var(--t-meta)/1.35 var(--font-sans);white-space:normal;box-shadow:0 6px 18px rgb(0 0 0 / .18);pointer-events:none}
  .pulse-bar [data-tip]:hover::after,.acts [data-tip]:hover::after,.r-head [data-tip]:hover::after,.d-head [data-tip]:hover::after,.m-top [data-tip]:hover::after,.s-foot [data-tip]:hover::after,.cmd [data-tip]:hover::after,.ai-row .badge[data-tip]:hover::after{left:auto;right:0}
  .top-bar [data-tip]:hover::after,.r-head [data-tip]:hover::after,.m-top [data-tip]:hover::after{bottom:auto;top:calc(100% + 6px)}
  .ai-row[data-tip]:hover::after{max-width:184px}
  [data-tip]:has([data-tip]:hover)::after{content:none}
}

@media (max-width:639px){

  .sec{padding:0 12px}
  .m-pulse{display:flex;align-items:center;gap:6px;padding:10px 12px 0}

  .none{padding:24px 14px}
  .it-r{padding:12px 12px 11px}
  .it-m{min-height:20px}
  .approval-why{padding:0 12px 10px 12px;flex-wrap:wrap}
  .approval-why input{font-size:16px;min-height:38px}
  .approval-why .btn{min-height:38px}
  .pill-act{height:28px;padding:0 9px}
  .row .r{gap:6px}
  .row .r .bar,.row .r .pj,.row .r .pr-pill{display:none}
  .row .r .age-col{width:auto}
  .d{display:none}
  .toast{left:12px;right:12px;bottom:56px}

async function copyText(text){
  if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
    try { await navigator.clipboard.writeText(text); return true; } catch(e) {}
  }
  try {
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(area);
    area.select();
    const ok = document.execCommand('copy');
    area.remove();
    return !!ok;
  } catch(e) { return false; }
}

  if (e.key === 'Escape') {
    if (typing) {
      if ((active === $('#q') || active === $('#mq')) && S.q) { setQ(''); }
      active.blur();
      return;
    }
    if (S.menu) { S.menu = null; render(); return; }
    if (S.denyOpen) { S.denyOpen = null; render(); return; }
    const prev = S.sheet || S.sel || S.open;
    S.sheet = null; S.sel = null; S.open = null; render();
    if (prev) focusRow(prev);
    return;
  }
  if (typing) return;
  const rows = Array.from(document.querySelectorAll('#content .it-r, #content .row'));
  const down = e.key === 'j' || e.key === 'ArrowDown', up = e.key === 'k' || e.key === 'ArrowUp';
  if ((down || up) && rows.length) {
    e.preventDefault();
    const cur = active && active.closest && active.closest('.it-r, .row');
    const idx = rows.indexOf(cur);
    const next = down ? rows[Math.min(rows.length - 1, idx + 1)] : rows[Math.max(0, idx <= 0 ? 0 : idx - 1)];
    if (next) next.focus();
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && active && active.matches && active.matches('.it-r, .row')) {
    e.preventDefault();
    const id = active.dataset.id;
    const it = D.find(x => x.id === id);
    if (e.key === ' ' && it && it.kind === 'mine') {
      const nextId = nextFocusIdAfterRemoval(id), prevAge = it.age;
      it.kind = 'done'; it.prev = 'mine'; it.age = 0; if (S.open === id) S.open = null; S.sheet = null; S.sel = null; render();
      focusRow(nextId);
      toast('已完成', () => { it.kind = 'mine'; it.age = prevAge; });
    } else {
      openItem(id, true);
    }
  }
});
$('#demo').addEventListener('click', e => {
  const b = e.target.closest('[data-demo]'); if (!b) return; e.stopPropagation();
  setDemo(b.dataset.demo);
});
setInterval(() => {
  if (matchMedia('(prefers-reduced-motion:reduce)').matches || S.demo === 'stale' || S.demo === 'empty') return;
  let needRender = false;
  D.forEach(it => {
    if (it.approval && !it.gone && !S.status[it.id] && it.ttl > 0) {
      it.ttl -= 1;
      if (it.ttl === 0) needRender = true;
      else document.querySelectorAll(`[data-ttl-id="${CSS.escape(it.id)}"]`).forEach(el => { el.textContent = `⏱ ${it.ttl}s`; });
    }
  });
  if (needRender) render();
}, 1000);
wide.addEventListener('change', render); phone.addEventListener('change', render);
const p = new URLSearchParams(location.search);
const qTheme = p.get('theme'), qView = p.get('view'), qDemo = p.get('demo');
document.documentElement.dataset.theme = (qTheme === 'dark' || qTheme === 'light') ? qTheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
if (['needs','run','all'].includes(qView)) S.view = qView;
if (['normal','empty','stale','notfound','offline','ttl0','dark'].includes(qDemo)) setDemo(qDemo);
else render();
</script>
